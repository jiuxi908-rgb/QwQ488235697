<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>一剑一蓑烟雨录</title>
<style>
:root{--gold:#d9ad62;--text:#f5e8cf;--muted:#b9a58a;--red:#b85b53;--green:#7aae6a;--line:#4b3a2d}
*{box-sizing:border-box}body{margin:0;background:#15120f;color:var(--text);font-family:Microsoft YaHei,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:12px}.panel{background:#241d18;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.btn{background:#3b2b21;color:var(--text);border:1px solid #6b503a;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn.primary{border-color:var(--gold)}.btn:disabled{opacity:.4}
.layout{display:grid;grid-template-columns:220px 1fr 260px;gap:10px}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:13px}
.log{height:160px;overflow:auto;background:#120f0d;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;line-height:1.5}
.section-title{color:var(--gold);margin:0 0 8px;font-size:15px}.power{color:var(--gold);font-weight:700}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}.pixel-map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.map-node{border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;font-size:12px;background:#1a1512;min-height:48px}
.map-node.current{border-color:var(--gold)}.small{font-size:11px;color:var(--muted)}
.title{font-size:36px;color:var(--gold)}.hero{min-height:70vh;display:grid;place-items:center;text-align:center}
.gain{color:var(--green)}.loss{color:var(--red)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const maps=[
{id:'qinghe',name:'清河镇',type:'城镇',desc:'水陆交汇小镇',neighbors:['bamboo','ferry','market'],events:['茶铺老板提醒先保命。'],explore:[{text:'帮客栈搬货。',type:'silver',value:8},{text:'医馆帮忙。',type:'heal',value:15},{text:'被人认错差点挨揍。',type:'damage',value:10,diff:25}]},
{id:'bamboo',name:'听雨竹径',type:'野外',desc:'细雨敲竹',neighbors:['qinghe','mist_gate'],events:['远处破空声。'],explore:[{text:'采药卖银。',type:'silver',value:12},{text:'练剑。',type:'exp',value:18},{text:'毒蛇咬伤。',type:'damage',value:20,diff:35}]},
{id:'ferry',name:'白沙渡',type:'渡口',desc:'渡船南北',neighbors:['qinghe','salt_road'],events:['商盟招护船。'],explore:[{text:'拉纤赚钱。',type:'silver',value:10},{text:'水贼交手。',type:'damage',value:18,diff:40}]},
{id:'market',name:'旧瓦市',type:'城镇',desc:'鱼龙混杂',neighbors:['qinghe'],events:['残谱兜售。'],explore:[{text:'淘货。',type:'silver',value:15},{text:'被扒。',type:'silver',value:-12,diff:30}]},
{id:'mist_gate',name:'烟岚山门',type:'门派',desc:'烟岚剑斋外门',neighbors:['bamboo'],events:['守山弟子审视你。'],explore:[{text:'观摩剑法。',type:'exp',value:25},{text:'山路滑倒。',type:'damage',value:12,diff:20}]},
{id:'salt_road',name:'黑盐古道',type:'野外',desc:'废弃盐道',neighbors:['ferry'],events:['刀光马蹄。'],explore:[{text:'搜刮残骸。',type:'silver',value:20},{text:'遭遇劫匪。',type:'damage',value:30,diff:55}]}
];
const origins=[{id:'farmer',name:'田舍少年',desc:'根骨高',stats:{bone:3,arm:1,luck:1}},{id:'orphan',name:'市井孤儿',desc:'身法高',stats:{agi:3,wit:1,luck:1}},{id:'scholar',name:'寒窗书生',desc:'悟性高',stats:{wit:4,qi:1}},{id:'merchant',name:'行商子弟',desc:'福缘高',stats:{luck:3,agi:1,wit:1}}];
const talents=[{id:'a',name:'过目不忘',stats:{wit:2}},{id:'b',name:'铁骨',stats:{bone:2}},{id:'c',name:'踏风',stats:{agi:2}},{id:'d',name:'天眷',stats:{luck:2}}];
const skills=[{id:'basic_fist',name:'破风拳',type:'拳掌',quality:'黄阶',req:{arm:6},cost:0,power:8,maxExp:50},{id:'basic_sword',name:'青锋剑诀',type:'剑法',quality:'黄阶',req:{agi:6},cost:0,power:12,maxExp:60},{id:'basic_qinggong',name:'踏雪无痕',type:'轻功',quality:'黄阶',req:{agi:7},cost:0,power:0,effect:'dodge+3',maxExp:50},{id:'basic_neigong',name:'养气诀',type:'内功',quality:'黄阶',req:{qi:6},cost:0,power:0,effect:'maxMp+20',maxExp:80},{id:'yanlan_sword',name:'烟岚十三剑',type:'剑法',quality:'玄阶',req:{agi:12,wit:10},cost:80,power:28,maxExp:120}];
const LOCAL={qinghe:['basic_fist','basic_sword','basic_neigong'],bamboo:['basic_qinggong'],mist_gate:['yanlan_sword']};
const BASE={arm:5,agi:5,bone:5,qi:5,wit:5,luck:5};
const LABELS={arm:'臂力',agi:'身法',bone:'根骨',qi:'内力',wit:'悟性',luck:'福缘'};
const REALMS=['初窥门径','登堂入室','融会贯通','炉火纯青','返璞归真'];
const KEY='yijian_save_v3';
const app=document.querySelector('#app');
let state={player:null};
function bonus(s,b={}){Object.entries(b).forEach(([k,v])=>s[k]=(s[k]||0)+v)}
function createP(o){const st={...BASE};bonus(st,origins.find(x=>x.id===o.origin)?.stats);bonus(st,talents.find(x=>x.id===o.talent)?.stats);return{name:o.name||'无名少侠',gender:o.gender,age:16,stats:st,hp:st.bone*20+80,maxHp:st.bone*20+80,mp:st.qi*15+60,maxMp:st.qi*15+60,silver:120,location:'qinghe',day:1,skills:[],logs:['踏入清河镇。']}}
function derived(p){let d=0,a=0;for(const s of p.skills||[]){if(s.effect){const m=String(s.effect).match(/dodge\+(\d+)/);if(m)d+=+m[1]*(1+s.realm*0.15)}}return{attack:Math.floor(p.stats.arm*2+p.stats.qi/2+a),dodge:Math.floor(p.stats.agi*2+d)}}
function power(p){const d=derived(p);let sp=0;for(const s of p.skills||[])sp+=(s.power||0)*(1+s.realm*0.25);return Math.floor(d.attack*2+d.dodge+sp+p.stats.bone+p.stats.qi/2)}
function threat(p,diff,dmg){const pw=power(p),r=pw/Math.max(diff,1);let out,hurt;if(r>=1.2){out='完胜';hurt=0;p.silver+=8}else if(r>=1){out='险胜';hurt=Math.max(1,Math.floor(dmg*0.4))}else if(r>=0.6){out='受挫';hurt=dmg}else{out='惨败';hurt=Math.floor(dmg*1.5)}p.hp=Math.max(1,p.hp-hurt);return{pw,diff,out,hurt}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function map(id){return maps.find(m=>m.id===id)}
function sk(id){return skills.find(s=>s.id===id)}
function move(p,id){const h=map(p.location);if(!h.neighbors.includes(id))return;p.location=id;p.day++;const n=map(id);p.logs.unshift('第'+p.day+'日【'+n.name+'】：'+(n.events[0]||''));p.logs=p.logs.slice(0,30)}
function explore(p){const h=map(p.location);if(!h.explore)return;p.day++;const e=h.explore[Math.floor(Math.random()*h.explore.length)];let msg='第'+p.day+'日游历【'+h.name+'】：'+e.text;if(e.type==='damage'||(e.type==='silver'&&e.value<0&&e.diff)){const t=threat(p,e.diff||30,e.type==='damage'?e.value:Math.abs(e.value));msg+=' 【战力'+t.pw+' vs 难度'+t.diff+' · '+t.out+'】';if(t.hurt)msg+='（气血-'+t.hurt+'）';if(t.out==='完胜')msg+='（银两+8）'}else if(e.type==='silver'){p.silver=Math.max(0,p.silver+e.value);msg+='（银两'+(e.value>0?'+':'')+e.value+'）'}else if(e.type==='heal'){p.hp=Math.min(p.maxHp,p.hp+e.value);msg+='（气血+'+e.value+'）'}else if(e.type==='exp'&&p.skills.length){const s=p.skills[0];s.exp=(s.exp||0)+e.value;msg+='（经验+'+e.value+'）'}p.logs.unshift(msg);p.logs=p.logs.slice(0,30)}
function learn(p,s){if(p.skills.some(x=>x.id===s.id))return '已学会';if(p.silver<s.cost)return '银两不足';for(const[k,v]of Object.entries(s.req||{}))if((p.stats[k]||0)<v)return k+'不足';p.silver-=s.cost;p.skills.push({id:s.id,name:s.name,type:s.type,quality:s.quality,realm:0,exp:0,maxExp:s.maxExp||100,power:s.power,effect:s.effect});if(s.effect&&String(s.effect).includes('maxMp')){p.maxMp+=20;p.mp=Math.min(p.mp+20,p.maxMp)}p.logs.unshift('学会【'+s.name+'】');return 'ok'}
function train(p,id){const s=p.skills.find(x=>x.id===id);if(!s||s.realm>=4)return;s.exp+=15+Math.floor(p.stats.wit/2);while(s.exp>=s.maxExp&&s.realm<4){s.exp-=s.maxExp;s.realm++;s.maxExp=Math.floor(s.maxExp*1.6);s.power=Math.floor((s.power||0)*1.25);p.logs.unshift('【'+s.name+'】突破至'+REALMS[s.realm])}}
function qs(s){return document.querySelector(s)}
function start(){app.innerHTML='<div class="hero panel"><h1 class="title">一剑一蓑烟雨录</h1><p class="small">战力判定 · 游历 · 武学（门派完整包即将补传）</p><div class="row" style="justify-content:center"><button class="btn primary" id="n">新入江湖</button><button class="btn" id="c" '+(localStorage.getItem(KEY)?'':'disabled')+'>读档</button></div></div>';qs('#n').onclick=create;qs('#c').onclick=()=>{state=load();if(state&&state.player)game()}}
function create(){app.innerHTML='<div class="panel"><h2 class="section-title">创建角色</h2><input id="name" placeholder="姓名" maxlength="8"/><select id="g"><option>男</option><option>女</option></select><h3>出身</h3><div class="row" id="o"></div><h3>天赋</h3><div class="row" id="t"></div><button class="btn primary" id="go">开始</button></div>';let sel={origin:origins[0].id,talent:talents[0].id};const box=(arr,el,k)=>{qs(el).innerHTML=arr.map(x=>'<button class="btn" data-id="'+x.id+'">'+x.name+'</button>').join('');qs(el).onclick=e=>{if(e.target.dataset.id){sel[k]=e.target.dataset.id}}};box(origins,'#o','origin');box(talents,'#t','talent');qs('#go').onclick=()=>{state.player=createP({name:qs('#name').value,gender:qs('#g').value,...sel});save();game()}}
function game(){const p=state.player;if(!p.skills)p.skills=[];const h=map(p.location),d=derived(p),pw=power(p);const local=(LOCAL[p.location]||[]).map(sk).filter(Boolean);
app.innerHTML='<div class="layout"><aside class="panel"><h2 class="section-title">'+p.name+'</h2><p class="small">'+p.gender+' · 第'+p.day+'日</p>'+Object.entries(LABELS).map(([k,v])=>'<div class="stat"><b>'+v+'</b><span>'+p.stats[k]+'</span></div>').join('')+'<div class="stat"><b>气血</b><span>'+p.hp+'/'+p.maxHp+'</span></div><div class="stat"><b>内力</b><span>'+p.mp+'/'+p.maxMp+'</span></div><div class="stat"><b>银两</b><span>'+p.silver+'</span></div><div class="stat"><b>攻/闪</b><span>'+d.attack+'/'+d.dodge+'</span></div><div class="stat"><b>战力</b><span class="power">'+pw+'</span></div><div class="row" style="margin-top:8px"><button class="btn" id="sv">保存</button><button class="btn" id="dl">删档</button><button class="btn primary" id="sk">武学</button></div></aside><main class="panel"><div class="row" style="justify-content:space-between"><h2 class="section-title">'+h.name+'</h2><button class="btn primary" id="ex">游历</button></div><p class="small">'+h.desc+' · <span class="tag">'+h.type+'</span></p><div class="pixel-map">'+maps.map(m=>'<div class="map-node '+(m.id===p.location?'current':'')+'" data-id="'+m.id+'"><b>'+m.name+'</b><p class="small">'+m.type+'</p></div>').join('')+'</div>'+(local.length?'<div class="row" style="margin-top:8px">'+local.map(s=>'<button class="btn learn" data-id="'+s.id+'">'+s.name+' '+s.cost+'两</button>').join('')+'</div>':'')+'</main><aside class="panel"><h3 class="section-title">见闻</h3><div class="log">'+p.logs.map(l=>'<div>· '+l+'</div>').join('')+'</div><h3 class="section-title">可前往</h3><div class="row">'+h.neighbors.map(id=>'<button class="btn move" data-id="'+id+'">'+map(id).name+'</button>').join('')+'</div></aside></div>';
document.querySelectorAll('.move,.map-node').forEach(el=>el.onclick=()=>{move(p,el.dataset.id);save();game()});
document.querySelectorAll('.learn').forEach(el=>el.onclick=()=>{learn(p,sk(el.dataset.id));save();game()});
qs('#ex').onclick=()=>{explore(p);save();game()};qs('#sv').onclick=()=>{save();p.logs.unshift('已保存');game()};qs('#dl').onclick=()=>{localStorage.removeItem(KEY);start()};qs('#sk').onclick=skillsUI}
function skillsUI(){const p=state.player;app.innerHTML='<div class="panel"><h2 class="section-title">武学 · 战力 '+power(p)+'</h2>'+(p.skills.length?p.skills.map(s=>'<div class="row" style="justify-content:space-between;margin:6px 0"><span>'+s.name+' · '+REALMS[s.realm]+' · 威力'+(s.power||0)+'</span><button class="btn train" data-id="'+s.id+'">修炼</button></div>').join(''):'<p class="small">尚未学武</p>')+'<button class="btn" id="back">返回</button></div>';document.querySelectorAll('.train').forEach(el=>el.onclick=()=>{train(p,el.dataset.id);save();skillsUI()});qs('#back').onclick=game}
start();
</script>
</body>
</html>
