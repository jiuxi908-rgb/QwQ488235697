<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>一剑一蓑烟雨录</title>
<style>
:root{--gold:#d9ad62;--text:#f5e8cf;--line:#4b3a2d}
*{box-sizing:border-box}
body{margin:0;background:#15120f;color:var(--text);font-family:Microsoft YaHei,system-ui,sans-serif}
#tip{padding:24px;min-height:100vh}
a{color:var(--gold)}
</style>
</head>
<body>
<p id="tip">正在加载完整游戏…</p>
<script>
/* 优先：同目录 data1/data2/logic（源码可读）
   若缺失：尝试从 GitHub raw 拉取后拼成单页 */
(async function(){
  const tip=document.getElementById('tip');
  const files=['data1.js','data2.js','logic.js'];
  async function loadLocal(){
    const texts=[];
    for(const f of files){
      const r=await fetch(f);
      if(!r.ok) throw new Error(f+' '+r.status);
      texts.push(await r.text());
    }
    return texts.join('\n');
  }
  async function loadRemote(){
    const base='https://raw.githubusercontent.com/jiuxi908-rgb/QwQ488235697/main/';
    const texts=[];
    for(const f of files){
      const r=await fetch(base+f);
      if(!r.ok) throw new Error('remote '+f);
      texts.push(await r.text());
    }
    return texts.join('\n');
  }
  try{
    let code;
    try{ code=await loadLocal(); }
    catch(e){ tip.textContent='本地脚本未找到，尝试在线拉取…'; code=await loadRemote(); }
    const s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
    tip.remove();
  }catch(e){
    tip.innerHTML='加载失败：'+e+'<br><br>请确保 <b>index.html、data1.js、data2.js、logic.js</b> 在同一目录，或联网后刷新。<br><br>仓库：<a href="https://github.com/jiuxi908-rgb/QwQ488235697">github.com/jiuxi908-rgb/QwQ488235697</a>';
  }
})();
</script>
</body>
</html>
