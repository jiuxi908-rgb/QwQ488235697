<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>一剑一蓑烟雨录</title>
  <style>
    :root{--bg:#15120f;--panel:#241d18;--gold:#d9ad62;--text:#f5e8cf;--muted:#b9a58a;--red:#b85b53;--green:#7aae6a;--line:#4b3a2d;--safe-bottom:max(80px, env(safe-area-inset-bottom, 0px) + 56px)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#2c211a,#111);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;padding-bottom:var(--safe-bottom)}
    .app{max-width:720px;margin:0 auto;padding:8px 8px var(--safe-bottom)}
    .hero{min-height:70vh;display:grid;place-items:center;text-align:center}
    .hero-card,.panel{background:linear-gradient(180deg,rgba(48,38,31,.96),rgba(29,23,19,.96));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;margin-bottom:8px}
    .title{font-size:32px;letter-spacing:4px;color:var(--gold);text-shadow:0 2px #000;margin:0 0 6px}
    .subtitle{color:var(--muted);line-height:1.5;font-size:13px}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .btn{background:#3b2b21;color:var(--text);border:1px solid #6b503a;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12px;line-height:1.3}
    .btn:hover,.btn.primary{background:#6b4630;border-color:var(--gold)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.sm{padding:4px 8px;font-size:11px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    label{display:grid;gap:3px;color:var(--muted);font-size:12px}
    input,select{background:#17120f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}
    .choice{border:1px solid var(--line);border-radius:8px;padding:8px;background:#1b1512;cursor:pointer}
    .choice.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,173,98,.2)}
    .stat{display:flex;justify-content:space-between;border-bottom:1px dashed #4b3a2d;padding:3px 0;font-size:12px}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
    .hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}
    .hud b{color:var(--gold)}
    .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .pixel-map{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
    .map-node{min-height:0;border:1px solid var(--line);border-radius:6px;background:#1a1512;padding:4px 5px;cursor:pointer;font-size:10px;line-height:1.25}
    .map-node b{font-size:11px;display:block}
    .map-node .small{margin:0;font-size:9px}
    .map-node.current{border-color:var(--gold);background:#34271e}
    .map-node.near{border-color:#8a6a45}
    .map-node.far{opacity:.45}
    .tag{display:inline-block;font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:99px;color:var(--muted);margin-right:2px}
    .log{height:120px;overflow-y:auto;background:#120f0d;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:#d8c6aa;line-height:1.4;font-size:11px}
    .log-item{padding:3px 0;border-bottom:1px solid rgba(75,58,45,.25)}
    .log-day{color:var(--gold);font-weight:600;margin-right:3px}
    .log-gain{color:var(--green)}.log-loss{color:var(--red)}.log-normal{color:#d8c6aa}
    .section-title{color:var(--gold);margin:0 0 6px;font-size:14px}
    .worlddoc{line-height:1.6;color:#e8d7bd;font-size:13px}.worlddoc h3{color:var(--gold);margin:10px 0 4px}
    .small{font-size:11px;color:var(--muted)}
    .loc-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
    .loc-head .section-title{margin:0}
    .power{color:var(--gold);font-weight:700}
    hr{border:none;border-top:1px solid var(--line);margin:6px 0}
    .compact-block{margin-top:6px}
    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px) + 12px) 12px max(100px, env(safe-area-inset-bottom, 0px) + 88px);box-sizing:border-box}
    .modal-panel{width:100%;max-width:480px;max-height:min(72vh, calc(100dvh - 140px));overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(48,38,31,.98),rgba(29,23,19,.98));border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:fadeIn .18s ease;margin:0 auto}
    @keyframes fadeIn{from{transform:translateY(12px);opacity:.4}to{transform:translateY(0);opacity:1}}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:0;background:rgba(40,32,26,.96);padding:4px 0 8px;z-index:1}
    .modal-head .section-title{margin:0}
    .modal-close{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
    .talk-bubble{background:#1a1512;border-left:3px solid var(--gold);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0;color:#e8d7bd;font-size:13px;line-height:1.5}
    .master-card{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:#1b1512}
    .master-card.active{border-color:var(--gold)}
    .favor-row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
    .favor-bar{flex:1;min-width:80px;height:8px;background:#1a1512;border:1px solid var(--line);border-radius:99px;overflow:hidden}
    .favor-fill{height:100%;border-radius:99px;transition:width .25s ease}
    .item-list{max-height:40vh;overflow-y:auto}
    .item-row{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-bottom:1px dashed rgba(75,58,45,.35);cursor:pointer}
    .item-row:active,.item-row:hover{background:rgba(217,173,98,.08)}
    .item-row.equipped{background:rgba(217,173,98,.1)}
    .item-icon{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:11px;color:var(--gold);background:#1a1512;flex-shrink:0}
    .item-icon.sm{width:24px;height:24px;font-size:10px}
    .item-meta{flex:1;min-width:0}
    .item-meta b{font-size:13px}
    .item-detail{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#1a1512}
    .equip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
    .equip-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:6px}
    .equip-slot{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#1a1512}
    .equip-slot.filled{background:#221c17}
    .equip-slot.empty{opacity:.65}
    .equip-slot-label{font-size:10px;color:var(--muted);margin-bottom:4px}
    .equip-slot-body{display:flex;align-items:center;gap:8px}
    .equip-slot-body .btn{margin-left:auto;flex-shrink:0}
    .equip-sum{margin:4px 0 6px}
    .buy-row{align-items:center}
    .buy-row .buy-item{margin-left:auto;flex-shrink:0}
    .rank-tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--gold);color:var(--gold)}
    .radar-wrap{display:flex;justify-content:center;margin:8px 0 4px}
    .radar-svg{display:block;max-width:100%;height:auto}
    .quest-list{display:flex;flex-direction:column;gap:8px}
    .quest-card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#1b1512}
    .quest-card.ready{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,173,98,.25)}
    .quest-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:4px}
    .quest-head b{font-size:13px;color:var(--text)}
    .quest-bar{height:6px;background:#120f0d;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
    .quest-fill{height:100%;background:linear-gradient(90deg,#6b4630,var(--gold));border-radius:99px;transition:width .2s ease}
    .skill-card{margin-bottom:0}
    .npc-profile .stat b{color:var(--muted);font-weight:500}
    body.modal-open{overflow:hidden}
    .modal-mask,.modal-panel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    @media(max-width:600px){
      .title{font-size:26px}
      .pixel-map{grid-template-columns:repeat(3,1fr)}
      .log{height:110px}
      .app{padding-bottom:calc(var(--safe-bottom) + 16px)}
      body{padding-bottom:calc(var(--safe-bottom) + 16px)}
      .panel{padding:8px 10px}
      .modal-mask{padding:max(12px, env(safe-area-inset-top, 0px) + 8px) 10px max(110px, env(safe-area-inset-bottom, 0px) + 96px);align-items:flex-start;padding-top:max(48px, env(safe-area-inset-top, 0px) + 36px)}
      .modal-panel{max-height:min(68vh, calc(100dvh - 160px));border-radius:12px}
    }
  </style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>

<script src="./data1.js"></script>
<script src="./text.js"></script>
<script src="./favor.js"></script>
<script src="./npc.js"></script>
<script src="./data2.js"></script>
<script src="./items.js"></script>
<script src="./core.js"></script>
<script src="./npc_logic.js"></script>
<script src="./time.js"></script>
<script src="./logic.js"></script>
<script src="./map_grid.js"></script>
<script src="./combat.js"></script>
<script src="./save_slots.js"></script>
<script src="./favor_ui.js"></script>
<script src="./time_ui.js"></script>
<script src="./items_ui.js"></script>
<script src="./home_trade.js"></script>
<script src="./home_resident.js"></script>
<script src="./home_companion.js"></script>
<script src="./quest.js"></script>
<script src="./sect_quest.js"></script>
<script src="./meridian.js"></script>
<script src="./skill_ui.js"></script>
<script src="./npc_profile.js"></script>
<script src="./romance.js"></script>
<script src="./romance_orient.js"></script>
<script src="./pixel_ui.js"></script>
<script src="./dialog_opt.js"></script>
<script src="./dialog_acts.js"></script>
<script src="./ui_smooth.js"></script>
</body>
</html>
