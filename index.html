<style>
:root{--bg:#15120f;--panel:#241d18;--gold:#d9ad62;--text:#f5e8cf;--muted:#b9a58a;--red:#b85b53;--green:#7aae6a;--line:#4b3a2d;--safe:max(80px,env(safe-area-inset-bottom,0px) + 56px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}body{padding-bottom:var(--safe)}.app{max-width:720px;margin:auto;padding:8px 8px var(--safe)}.hero{min-height:70vh;display:grid;place-items:center;text-align:center}.hero-card,.panel{background:linear-gradient(180deg,rgba(48,38,31,.96),rgba(29,23,19,.96));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;margin-bottom:8px}.title{font-size:32px;letter-spacing:4px;color:var(--gold);text-shadow:0 2px #000}.subtitle,.small{color:var(--muted);font-size:12px;line-height:1.5}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;background:#3b2b21;color:var(--text);border:1px solid #6b503a;border-radius:7px;padding:8px 11px;cursor:pointer;font-size:12px}.btn:hover,.btn.primary{background:#6b4630;border-color:var(--gold)}.btn:disabled{opacity:.45}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}label{display:grid;gap:3px;color:var(--muted);font-size:12px}input,select{min-height:44px;background:#17120f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}.choice{border:1px solid var(--line);border-radius:8px;padding:8px;background:#1b1512;cursor:pointer}.choice.active{border-color:var(--gold)}.stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:12px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}.hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}.hud b,.power{color:var(--gold)}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pixel-map{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.map-node{border:1px solid var(--line);border-radius:6px;background:#1a1512;padding:6px;cursor:pointer;font-size:10px;line-height:1.25;min-height:44px}.map-node b{font-size:11px;display:block}.map-node.current{border-color:var(--gold);background:#34271e}.map-node.near{border-color:#8a6a45}.map-node.far{opacity:.45}.tag{display:inline-block;font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.log{height:120px;overflow-y:auto;background:#120f0d;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:#d8c6aa;font-size:11px}.section-title{color:var(--gold);margin:0 0 6px;font-size:14px}.loc-head{display:flex;justify-content:space-between;align-items:center;gap:6px}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px 12px calc(var(--safe) + 16px)}.modal-panel{width:100%;max-width:480px;max-height:78vh;overflow:auto;background:linear-gradient(180deg,rgba(48,38,31,.98),rgba(29,23,19,.98));border:1px solid var(--line);border-radius:12px;padding:12px 14px}.modal-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#2b221b;padding:4px 0 8px;z-index:1}.modal-close{min-width:44px;min-height:44px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px}.talk-bubble,.main-obj{background:#1a1512;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.5}.hp-warn{color:var(--red);font-weight:700}@media(max-width:600px){.title{font-size:26px}.pixel-map{grid-template-columns:repeat(3,1fr)}.panel{padding:8px 10px}.modal-mask{align-items:flex-start;padding-top:max(48px,env(safe-area-inset-top,0px) + 36px)}.modal-panel{max-height:68vh;border-radius:12px}}
