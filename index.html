<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一剑一蓑烟雨录</title>
  <style>
    :root{--bg:#15120f;--panel:#241d18;--gold:#d9ad62;--text:#f5e8cf;--muted:#b9a58a;--red:#b85b53;--green:#7aae6a;--line:#4b3a2d}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#2c211a,#111);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
    .app{max-width:1100px;margin:0 auto;padding:12px}
    .hero{min-height:80vh;display:grid;place-items:center;text-align:center}
    .hero-card,.panel{background:linear-gradient(180deg,rgba(48,38,31,.96),rgba(29,23,19,.96));border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35);border-radius:12px;padding:14px 16px}
    .title{font-size:42px;letter-spacing:6px;color:var(--gold);text-shadow:0 2px #000;margin:0 0 6px}
    .subtitle{color:var(--muted);line-height:1.6;font-size:14px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:#3b2b21;color:var(--text);border:1px solid #6b503a;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
    .btn:hover,.btn.primary{background:#6b4630;border-color:var(--gold)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    label{display:grid;gap:4px;color:var(--muted);font-size:13px}
    input,select{background:#17120f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}
    .choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:#1b1512;cursor:pointer}
    .choice.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,173,98,.2)}
    .stat{display:flex;justify-content:space-between;border-bottom:1px dashed #4b3a2d;padding:4px 0;font-size:13px}
    /* 核心紧凑布局 */
    .layout{display:grid;grid-template-columns:220px 1fr 280px;gap:10px;align-items:start}
    .pixel-map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .map-node{min-height:64px;border:1px solid var(--line);border-radius:8px;background:#1a1512;padding:8px;cursor:pointer;font-size:12px}
    .map-node b{font-size:13px}
    .map-node.current{border-color:var(--gold);background:#34271e}
    .map-node .small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .tag{display:inline-block;font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:99px;color:var(--muted);margin-right:3px}
    .log{height:200px;overflow-y:auto;background:#120f0d;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:#d8c6aa;line-height:1.45;font-size:12px}
    .log-item{padding:4px 0;border-bottom:1px solid rgba(75,58,45,.3)}
    .log-item:last-child{border-bottom:none}
    .log-day{color:var(--gold);font-weight:600;margin-right:3px}
    .log-gain{color:var(--green)}
    .log-loss{color:var(--red)}
    .log-normal{color:#d8c6aa}
    .section-title{color:var(--gold);margin:0 0 8px;font-size:15px}
    .worlddoc{line-height:1.7;color:#e8d7bd}
    .worlddoc h3{color:var(--gold);margin-bottom:0}
    .small{font-size:11px;color:var(--muted)}
    .loc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
    .loc-head .section-title{margin:0}
    hr{border:none;border-top:1px solid var(--line);margin:8px 0}
    @media(max-width:900px){
      .grid,.layout{grid-template-columns:1fr}
      .title{font-size:30px}
      .form-grid{grid-template-columns:1fr}
      .log{height:160px}
    }
  </style>
</head>

ower":45,"effect":"内伤","maxExp":250},{"id":"jiwu_sword","name":"缉武断罪剑","type":"剑法","quality":"地阶","desc":"缉武司秘传剑法，专克邪道武功。","req":{"arm":16,"wit":14,"luck":8},"cost":280,"mp":22,"power":50,"effect":"破绽","maxExp":280},{"id":"night_shadow","name":"夜行影步","type":"轻功","quality":"地阶","desc":"邪道常用轻功，夜间几乎无声无息。","req":{"agi":20,"luck":10},"cost":260,"mp":12,"power":0,"effect":"dodge+12,first+5","maxExp":260},{"id":"blood_blade","name":"血海狂刀","type":"刀法","quality":"地阶","desc":"以血养刀的邪道刀法，杀意极重。","req":{"arm":20,"bone":12},"cost":300,"mp":30,"power":60,"effect":"流血","maxExp":300},{"id":"tian_jian","name":"天问一剑","type":"剑法","quality":"天阶","desc":"传说中的绝世剑法，一剑问天，势不可挡。","req":{"agi":25,"wit":22,"qi":20},"cost":800,"mp":50,"power":100,"effect":"破绽","maxExp":500},{"id":"dragon_neigong","name":"潜龙吐息","type":"内功","quality":"天阶","desc":"上古内功残篇，内力如龙潜渊，爆发惊人。","req":{"qi":28,"bone":20},"cost":900,"mp":0,"power":0,"effect":"maxMp+150,attack+15","maxExp":550},{"id":"phantom_palm","name":"千影幻掌","type":"拳掌","quality":"天阶","desc":"掌影千变，真假难辨，专克重攻。","req":{"agi":24,"wit":20},"cost":850,"mp":40,"power":80,"effect":"迟滞","maxExp":520},{"id":"star_throw","name":"摘星手","type":"暗器","quality":"地阶","desc":"暗器高手秘传，可空手接物，亦可弹射暗器。","req":{"agi":18,"wit":15},"cost":220,"mp":15,"power":38,"effect":"破绽","maxExp":240},{"id":"iron_shirt","name":"铁布衫","type":"内功","quality":"玄阶","desc":"外家硬功，显著提升气血与抗性。","req":{"bone":14,"arm":10},"cost":100,"mp":0,"power":0,"effect":"maxHp+80,bone+1","maxExp":140}];

const BASE_STATS = {arm:5,agi:5,bone:5,qi:5,wit:5,luck:5};
const STAT_LABELS = {arm:'臂力',agi:'身法',bone:'根骨',qi:'内力',wit:'悟性',luck:'福缘'};

function applyBonus(stats, bonus = {}) { Object.entries(bonus).forEach(([k,v]) => stats[k] += v); }
function createPlayer({name, gender, origin, talent}) {
  const stats = {...BASE_STATS};
  applyBonus(stats, origins.find(o => o.id === origin)?.stats);
  applyBonus(stats, talents.find(t => t.id === talent)?.stats);
  return {name: name||'无名少侠', gender, age:16, origin, talent, stats, hp:stats.bone*20+80, maxHp:stats.bone*20+80, mp:stats.qi*15+60, maxMp:stats.qi*15+60, silver:120, location:'qinghe', reputation:0, day:1, skills:[], logs:['十六岁这年，你背起旧包袱，踏入清河镇。']};
}
function derived(player) {
  let dodgeBonus=0, attackBonus=0;
  for (const s of player.skills||[]) {
    if (s.effect && typeof s.effect==='string') {
      const dm=s.effect.match(/dodge\+(\d+)/); if(dm) dodgeBonus+=parseInt(dm[1])*(1+s.realm*0.15);
      const am=s.effect.match(/attack\+(\d+)/); if(am) attackBonus+=parseInt(am[1])*(1+s.realm*0.15);
    }
  }
  return {attack:Math.floor(player.stats.arm*2+player.stats.qi/2+attackBonus), dodge:Math.floor(player.stats.agi*2+dodgeBonus), learn:player.stats.wit*3, encounter:player.stats.luck*2};
}

const SAVE_KEY = 'yijian_yisuo_save_v1';
function saveGame(state){localStorage.setItem(SAVE_KEY,JSON.stringify({...state,savedAt:new Date().toISOString()}));}
function loadGame(){const raw=localStorage.getItem(SAVE_KEY);return raw?JSON.parse(raw):null;}
function hasSave(){return Boolean(localStorage.getItem(SAVE_KEY));}
function deleteSave(){localStorage.removeItem(SAVE_KEY);}

function getMapById(id){return maps.find(m=>m.id===id);}
function movePlayer(player, targetId){
  const here=getMapById(player.location);
  if(!here||!here.neighbors.includes(targetId)) return {ok:false,message:'道路未通，无法前往。'};
  player.location=targetId; player.day+=1;
  const next=getMapById(targetId);
  const event=next.events[Math.floor(Math.random()*next.events.length)];
  player.logs.unshift(`第${player.day}日，你来到【${next.name}】：${event}`);
  player.logs=player.logs.slice(0,40);
  return {ok:true,message:event};
}
function exploreLocation(player){
  const here=getMapById(player.location);
  if(!here||!here.explore||!here.explore.length) return {ok:false,message:'此地暂无游历内容。'};
  player.day+=1;
  const evt=here.explore[Math.floor(Math.random()*here.explore.length)];
  let msg=`第${player.day}日，你在【${here.name}】游历：${evt.text}`;
  switch(evt.type){
    case 'silver': player.silver=Math.max(0,player.silver+evt.value); msg+=evt.value>0?`（银两+${evt.value}）`:`（银两${evt.value}）`; break;
    case 'heal': player.hp=Math.min(player.maxHp,player.hp+evt.value); msg+=`（气血+${evt.value}）`; break;
    case 'damage': player.hp=Math.max(1,player.hp-evt.value); msg+=`（气血-${evt.value}）`; break;
    case 'mp': player.mp=Math.min(player.maxMp,player.mp+evt.value); msg+=`（内力+${evt.value}）`; break;
    case 'exp':
      if(player.skills&&player.skills.length){
        const s=player.skills[Math.floor(Math.random()*player.skills.length)];
        s.exp+=evt.value; msg+=`（【${s.name}】经验+${evt.value}）`;
        while(s.exp>=s.maxExp&&s.realm<4){s.exp-=s.maxExp;s.realm+=1;s.maxExp=Math.floor(s.maxExp*1.6);s.power=Math.floor((s.power||0)*1.25);msg+=' → 突破！';}
      } else msg+='（无武学可练）';
      break;
    case 'stat': if(player.stats[evt.key]!==undefined){player.stats[evt.key]+=evt.value;msg+=`（${evt.key}+${evt.value}）`;} break;
  }
  player.logs.unshift(msg); player.logs=player.logs.slice(0,40);
  return {ok:true,message:msg};
}

function getSkillById(id){return skills.find(s=>s.id===id);}
function canLearn(player, skill){
  if(player.skills.some(s=>s.id===skill.id)) return {ok:false,msg:'你已学会此武学。'};
  if(player.silver<skill.cost) return {ok:false,msg:`银两不足，需要${skill.cost}两。`};
  for(const [k,v] of Object.entries(skill.req||{})){if((player.stats[k]||0)<v) return {ok:false,msg:`属性不足：${k}需要${v}。`};}
  return {ok:true};
}
function learnSkill(player, skill){
  const check=canLearn(player,skill); if(!check.ok) return check;
  player.silver-=skill.cost;
  player.skills.push({id:skill.id,name:skill.name,type:skill.type,quality:skill.quality,realm:0,exp:0,maxExp:skill.maxExp||100,power:skill.power,mp:skill.mp,effect:skill.effect});
  applyPassive(player,skill);
  player.logs.unshift(`你学会了【${skill.name}】（${skill.quality}${skill.type}）！`);
  return {ok:true,msg:`学会【${skill.name}】`};
}
function applyPassive(player, skill){
  if(!skill.effect||typeof skill.effect!=='string') return;
  skill.effect.split(',').forEach(p=>{
    const m=p.trim().match(/(\w+)\+(\d+)/); if(!m) return;
    const [,key,val]=m; const n=parseInt(val);
    if(key==='maxHp'){player.maxHp+=n;player.hp=Math.min(player.hp+n,player.maxHp);}
    else if(key==='maxMp'){player.maxMp+=n;player.mp=Math.min(player.mp+n,player.maxMp);}
    else if(player.stats[key]!==undefined) player.stats[key]+=n;
  });
}
function trainSkill(player, skillId, amount=10){
  const s=player.skills.find(x=>x.id===skillId);
  if(!s) return {ok:false,msg:'未学会此武学。'};
  if(s.realm>=4) return {ok:false,msg:'已达返璞归真。'};
  s.exp+=amount;
  while(s.exp>=s.maxExp&&s.realm<4){s.exp-=s.maxExp;s.realm+=1;s.maxExp=Math.floor(s.maxExp*1.6);s.power=Math.floor((s.power||0)*1.25);player.logs.unshift(`【${s.name}】突破至【${SKILL_DESIGN.realms[s.realm]}】！`);}
  return {ok:true,msg:`修炼【${s.name}】`};
}

const app=document.querySelector('#app');

const LOCAL_SKILLS={qinghe:['basic_fist','basic_sword','basic_neigong'],bamboo:['basic_qinggong','basic_blade'],market:['throwing_needle','basic_fist'],mist_gate:['yanlan_sword','basic_qinggong'],ferry:['basic_blade'],salt_road:['night_shadow','blood_blade']};

function formatLog(text){
  if(!text) return '';
  const dayMatch=text.match(/^(第\d+日)/);
  const day=dayMatch?dayMatch[1]:'';
  let body=day?text.slice(day.length).replace(/^，/,''):text;
  let cls='log-normal';
  if(/[＋+]\d+|银两\+\d+|气血\+\d+|内力\+\d+|经验\+\d+|突破/.test(body)) cls='log-gain';
  else if(/[－-]\d+|银两-\d+|气血-\d+|损失|受伤|挨揍|被砍|丢命/.test(body)) cls='log-loss';
  body=body.replace(/（([^）]+)）/g,`<span class="${cls}">（$1）</span>`);
  return `<div class="log-item"><span class="log-day">${day}</span><span class="${cls}">${body}</span></div>`;
}
function qs(s){return document.querySelector(s);}

function renderStart(){

  qs('#continue').onclick=()=>{state=loadGame();if(state.player&&!state.player.skills)state.player.skills=[];renderGame();};

}

  let selected={origin:origins[0].id,talent:talents[0].id};markChoices(selected);
  document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{selected[el.dataset.kind]=el.dataset.id;markChoices(selected);});
  qs('#begin').onclick=()=>{state.player=createPlayer({name:qs('#name').value.trim(),gender:qs('#gender').value,...selected});saveGame(state);renderGame();};
  qs('#back').onclick=renderStart;
}
function choice(o,kind){return `<div class="choice" data-kind="${kind}" data-id="${o.id}"><b>${o.name}</b><p class="small">${o.desc}</p></div>`;}
function markChoices(sel){document.querySelectorAll('.choice').forEach(el=>el.classList.toggle('active',sel[el.dataset.kind]===el.dataset.id));}

function renderGame(){
  const p=state.player; if(!p.skills)p.skills=[];

  app.innerHTML=`
  <div class="layout">
    <aside class="panel">
      <h2 class="section-title">${p.name}</h2>
      <p class="small">${p.gender} · ${p.age}岁 · 第${p.day}日</p>
      ${Object.entries(STAT_LABELS).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${p.stats[k]}</span></div>`).join('')}
      <hr>
      <div class="stat"><b>气血</b><span>${p.hp}/${p.maxHp}</span></div>
      <div class="stat"><b>内力</b><span>${p.mp}/${p.maxMp}</span></div>
      <div class="stat"><b>银两</b><span>${p.silver}</span></div>

      <div class="row" style="margin-top:8px">

        <button class="btn primary" id="skillBtn">武学</button>
      </div>
    </aside>
    <main class="panel">
      <div class="loc-head">
        <h2 class="section-title">${here.name}</h2>
        <button class="btn primary" id="exploreBtn">游历此地</button>
      </div>
      <p class="small">${here.desc} · <span class="tag">${here.type}</span></p>
      <div class="pixel-map" style="margin:8px 0">${maps.map(m=>`<div class="map-node ${m.id===p.location?'current':''}" data-id="${m.id}"><b>${m.name}</b><p class="small">${m.type}</p></div>`).join('')}</div>
      ${local.length?`<div class="row" style="margin-top:6px">${local.map(s=>{const owned=p.skills.some(x=>x.id===s.id);return `<button class="btn ${owned?'':'primary'} learn" data-id="${s.id}" ${owned?'disabled':''}>${s.name} <span class="small">${s.cost}两</span></button>`;}).join('')}</div>`:''}
    </main>
    <aside class="panel">
      <h3 class="section-title">江湖见闻</h3>
      <div class="log">${p.logs.map(formatLog).join('')}</div>
      <h3 class="section-title" style="margin-top:10px">可前往</h3>
      <div class="row">${here.neighbors.map(id=>`<button class="btn move" data-id="${id}">${getMapById(id).name}</button>`).join('')}</div>
    </aside>
  </div>`;

  document.querySelectorAll('.move,.map-node').forEach(el=>el.onclick=()=>{if(movePlayer(p,el.dataset.id).ok){saveGame(state);renderGame();}});
  document.querySelectorAll('.learn').forEach(el=>el.onclick=()=>{const res=learnSkill(p,getSkillById(el.dataset.id));p.logs.unshift(res.msg);saveGame(state);renderGame();});
  qs('#exploreBtn').onclick=()=>{const res=exploreLocation(p);if(res.ok){saveGame(state);renderGame();}else{p.logs.unshift(res.message);renderGame();}};
  qs('#save').onclick=()=>{saveGame(state);p.logs.unshift('你整理行囊，保存了当前江湖足迹。');renderGame();};
  qs('#del').onclick=()=>{deleteSave();renderStart();};
  qs('#skillBtn').onclick=renderSkills;
}

function renderSkills(){
  const p=state.player; if(!p.skills)p.skills=[];
  app.innerHTML=`<section class="panel"><h2 class="section-title">已学武学（${p.skills.length}）</h2>
    ${p.skills.length===0?'<p class="small">你还不会任何武学。</p>':`<div class="row" style="flex-direction:column;gap:8px">${p.skills.map(s=>`<div class="choice" style="display:flex;justify-content:space-between;align-items:center"><div><b>${s.name}</b> <span class="tag">${s.quality}</span> <span class="tag">${s.type}</span><p class="small">${SKILL_DESIGN.realms[s.realm]} · ${s.exp}/${s.maxExp} · 威力${s.power||0}</p></div><button class="btn train" data-id="${s.id}" ${s.realm>=4?'disabled':''}>修炼</button></div>`).join('')}</div>`}
    <div class="row" style="margin-top:12px"><button class="btn" id="back">返回</button></div></section>`;
  document.querySelectorAll('.train').forEach(el=>el.onclick=()=>{const res=trainSkill(p,el.dataset.id,15+Math.floor(p.stats.wit/2));p.logs.unshift(res.msg);saveGame(state);renderSkills();});
  qs('#back').onclick=renderGame;
}

  app.innerHTML=`<section class="panel worlddoc"><h2 class="section-title">完整游戏方案</h2>
    <h3>1. 世界观</h3><p>${world.background}</p><ul>${world.states.concat(world.rules,world.factions).map(x=>`<li>${x}</li>`).join('')}</ul>
