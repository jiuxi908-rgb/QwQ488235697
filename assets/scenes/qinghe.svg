<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" shape-rendering="crispEdges">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#1a120c" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- sky -->
  <rect width="640" height="360" fill="#1e1814"/>
  <rect width="640" height="200" fill="#2a221c"/>
  <rect y="160" width="640" height="40" fill="#3a2e24"/>
  <!-- distant hills -->
  <rect x="0" y="140" width="120" height="40" fill="#243028"/>
  <rect x="100" y="120" width="180" height="60" fill="#2a382c"/>
  <rect x="400" y="130" width="240" height="50" fill="#243028"/>
  <!-- road -->
  <rect y="260" width="640" height="100" fill="#2a2218"/>
  <rect y="280" width="640" height="12" fill="#3a3024"/>
  <rect y="300" width="640" height="4" fill="#4a3a28"/>
  <!-- inn left -->
  <rect x="40" y="160" width="140" height="120" fill="#4a3020"/>
  <rect x="32" y="148" width="156" height="20" fill="#6b3a28"/>
  <rect x="60" y="200" width="40" height="50" fill="#1a1008"/>
  <rect x="120" y="190" width="36" height="28" fill="#3a5040"/>
  <rect x="48" y="168" width="24" height="8" fill="#d9ad62" opacity=".5"/>
  <text x="70" y="185" fill="#d9ad62" font-size="14" font-family="sans-serif">客栈</text>
  <!-- clinic center-left -->
  <rect x="200" y="180" width="100" height="100" fill="#3a4a38"/>
  <rect x="192" y="170" width="116" height="16" fill="#5a6a48"/>
  <rect x="230" y="210" width="32" height="40" fill="#1a1810"/>
  <text x="220" y="200" fill="#9ece8a" font-size="13" font-family="sans-serif">医馆</text>
  <!-- street booth -->
  <rect x="320" y="200" width="80" height="70" fill="#4a3a28"/>
  <rect x="312" y="192" width="96" height="12" fill="#6b503a"/>
  <text x="335" y="230" fill="#b9a58a" font-size="12" font-family="sans-serif">拳场</text>
  <!-- gate right -->
  <rect x="480" y="140" width="120" height="140" fill="#3a3228"/>
  <rect x="500" y="180" width="80" height="100" fill="#1a1510"/>
  <rect x="470" y="130" width="140" height="18" fill="#5a4a30"/>
  <text x="505" y="165" fill="#d9ad62" font-size="13" font-family="sans-serif">官道</text>
  <!-- lanterns -->
  <rect x="70" y="155" width="8" height="12" fill="#d9ad62"/>
  <rect x="150" y="155" width="8" height="12" fill="#d9ad62"/>
  <rect x="520" y="150" width="8" height="12" fill="#c87870"/>
  <!-- pixel grain -->
  <rect width="640" height="360" fill="url(#grid)" opacity=".25"/>
  <text x="16" y="28" fill="#b9a58a" font-size="16" font-family="sans-serif">清河镇</text>
  <text x="16" y="48" fill="#6b5a48" font-size="11" font-family="sans-serif">点选热区 · 旧界面仍可用</text>
</svg>
