<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" shape-rendering="crispEdges">
  <rect width="640" height="360" fill="#16141c"/>
  <rect width="640" height="160" fill="#1e1a28"/>
  <!-- mist layers -->
  <rect y="140" width="640" height="30" fill="#2a2838" opacity=".6"/>
  <rect y="160" width="640" height="40" fill="#242030" opacity=".5"/>
  <!-- mountain body -->
  <rect x="80" y="80" width="200" height="180" fill="#2a2438"/>
  <rect x="360" y="60" width="220" height="200" fill="#282438"/>
  <!-- gate building -->
  <rect x="240" y="120" width="160" height="140" fill="#3a3048"/>
  <rect x="230" y="110" width="180" height="20" fill="#5a4060"/>
  <rect x="280" y="160" width="80" height="100" fill="#1a1420"/>
  <text x="275" y="150" fill="#d9ad62" font-size="14" font-family="sans-serif">烟岚剑斋</text>
  <!-- practice ground -->
  <rect x="40" y="220" width="100" height="60" fill="#2a2830"/>
  <text x="55" y="255" fill="#9a8ab0" font-size="12" font-family="sans-serif">练剑坪</text>
  <!-- disciple area -->
  <rect x="480" y="200" width="120" height="80" fill="#2a2830"/>
  <text x="505" y="245" fill="#9a8ab0" font-size="12" font-family="sans-serif">外门</text>
  <!-- path down -->
  <rect y="280" width="640" height="80" fill="#1a1820"/>
  <rect y="290" width="640" height="12" fill="#2a2830"/>
  <text x="16" y="28" fill="#b9a58a" font-size="16" font-family="sans-serif">烟岚山门</text>
  <text x="16" y="48" fill="#6b5a48" font-size="11" font-family="sans-serif">门派样板 · 点热区</text>
</svg>
