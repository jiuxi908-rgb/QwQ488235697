<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" shape-rendering="crispEdges">
  <rect width="640" height="360" fill="#1a1410"/>
  <rect width="640" height="140" fill="#241c16"/>
  <!-- city wall top -->
  <rect y="100" width="640" height="40" fill="#3a3028"/>
  <rect x="0" y="90" width="40" height="50" fill="#4a3a30"/>
  <rect x="600" y="90" width="40" height="50" fill="#4a3a30"/>
  <!-- main street -->
  <rect y="200" width="640" height="160" fill="#2a2218"/>
  <rect y="240" width="640" height="20" fill="#3a3228"/>
  <!-- buildings left - yamen/jwu -->
  <rect x="30" y="140" width="120" height="100" fill="#4a3020"/>
  <rect x="20" y="130" width="140" height="18" fill="#6b3a28"/>
  <text x="45" y="175" fill="#d9ad62" font-size="12" font-family="sans-serif">御街·市井</text>
  <!-- temple center -->
  <rect x="200" y="130" width="140" height="110" fill="#3a4a38"/>
  <rect x="190" y="120" width="160" height="16" fill="#5a6a48"/>
  <text x="230" y="170" fill="#9ece8a" font-size="12" font-family="sans-serif">相国寺外</text>
  <!-- south gate / exit -->
  <rect x="400" y="150" width="100" height="90" fill="#3a3228"/>
  <rect x="420" y="180" width="60" height="60" fill="#1a1510"/>
  <text x="415" y="170" fill="#b9a58a" font-size="11" font-family="sans-serif">出城·下辖</text>
  <!-- long road -->
  <rect x="520" y="140" width="100" height="100" fill="#2a382c"/>
  <text x="535" y="190" fill="#d9ad62" font-size="11" font-family="sans-serif">长途官道</text>
  <!-- lanterns -->
  <rect x="60" y="145" width="6" height="10" fill="#d9ad62"/>
  <rect x="140" y="145" width="6" height="10" fill="#d9ad62"/>
  <rect x="260" y="135" width="6" height="10" fill="#c87870"/>
  <text x="16" y="28" fill="#b9a58a" font-size="16" font-family="sans-serif">开封（东京）</text>
  <text x="16" y="48" fill="#6b5a48" font-size="11" font-family="sans-serif">州府样板 · 点热区</text>
</svg>
